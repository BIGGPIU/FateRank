[package]
name = "startgg-interactions"
version = "0.1.0"
edition = "2024"

[dependencies]
indicatif = "0.18.6"
json = "0.12.4"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.151"
skillratings = "0.29.2"
sqlx = {version = "0.9.0", features = ["sqlite","runtime-tokio"]}
thirtyfour = "0.37.5"
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread"] }
